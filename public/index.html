<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Submundo: Ink Ops</title>
<meta name="game-build" content="reino-copas-v75-final-map">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e5ddc9;color:#171510;font-family:Georgia,serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#e5ddc9}#hud{position:fixed;inset:0;pointer-events:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;font-weight:700;text-shadow:0 1px #eee7d4}.panel{background:rgba(238,231,212,.72);border:2px solid #171510;padding:7px 10px;min-width:110px}.bar{width:110px;height:10px;border:2px solid #171510;margin-top:4px}.bar i{display:block;height:100%;width:100%;background:#171510}#armor{background:#356bc1}.center{position:fixed;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none}#hitNotice{position:fixed;left:50%;top:18%;transform:translateX(-50%) rotate(-2deg);z-index:9;pointer-events:none;font:900 28px Georgia,serif;letter-spacing:2px;color:#d73535;text-shadow:2px 2px 0 #fff,0 0 8px rgba(255,255,255,.9);opacity:0;transition:opacity .08s;white-space:nowrap}#hitNotice.show{opacity:1}.center:before,.center:after{content:"";position:absolute;background:#171510}.center:before{left:7px;top:0;width:2px;height:16px}.center:after{left:0;top:7px;width:16px;height:2px}.controls{position:fixed;inset:0;pointer-events:none}.rifle-scope{position:fixed;inset:0;z-index:7;pointer-events:none;display:none;opacity:0;overflow:hidden}.rifle-scope:before{content:"";position:absolute;left:50%;top:50%;width:min(72vw,72vh);height:min(72vw,72vh);transform:translate(-50%,-50%);border:3px solid rgba(20,28,34,.88);border-radius:50%;box-shadow:0 0 0 2px rgba(244,241,229,.4),inset 0 0 28px rgba(0,0,0,.35);background:radial-gradient(circle,rgba(255,255,255,0) 0 48%,rgba(10,16,22,.10) 49% 55%,rgba(10,16,22,.48) 56% 100%)}.rifle-scope .scope-cross-h,.rifle-scope .scope-cross-v{position:absolute;left:50%;top:50%;background:rgba(22,28,32,.92);box-shadow:0 0 0 1px rgba(255,255,255,.25)}.rifle-scope .scope-cross-h{width:86%;height:2px;transform:translate(-50%,-50%)}.rifle-scope .scope-cross-v{width:2px;height:86%;transform:translate(-50%,-50%)}.rifle-scope .scope-dot{position:absolute;left:50%;top:50%;width:6px;height:6px;border:2px solid #171510;border-radius:50%;background:#f4f1e5;transform:translate(-50%,-50%)}.rifle-scope .scope-mark{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);font:700 11px Georgia,serif;letter-spacing:5px;color:rgba(20,25,29,.8)}.stick{position:absolute;left:22px;bottom:24px;width:118px;height:118px;border:3px solid #171510;border-radius:50%;background:rgba(238,231,212,.55);pointer-events:auto}.knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border:3px solid #171510;border-radius:50%;background:rgba(229,221,201,.9)}#fire,#fireLeft{position:absolute;bottom:28px;width:92px;height:92px;border:3px solid #171510;border-radius:50%;background:rgba(238,231,212,.72);font:700 18px Georgia;color:#171510;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;z-index:12;box-shadow:4px 4px 0 rgba(23,21,16,.18)}#fire{right:20px}#fireLeft{left:158px;bottom:36px;width:78px;height:78px;font-size:14px}#weaponSwitch{position:absolute;right:20px;bottom:190px;width:108px;height:52px;border:3px solid #171510;border-radius:14px;background:rgba(238,231,212,.82);font:700 15px Georgia;color:#171510;pointer-events:auto;box-shadow:4px 4px 0 rgba(23,21,16,.16)}#reload{position:absolute;right:20px;bottom:132px;width:96px;height:52px;border:3px solid #171510;border-radius:14px;background:rgba(238,231,212,.88);font:700 15px Georgia;color:#171510;pointer-events:auto;box-shadow:4px 4px 0 rgba(23,21,16,.16)}.hint{position:absolute;right:16px;bottom:194px;opacity:.7;font-size:13px;text-align:right}.inkTexture{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.13;background:repeating-linear-gradient(12deg,transparent 0 7px,rgba(23,21,16,.22) 8px,transparent 9px 15px),repeating-linear-gradient(102deg,transparent 0 13px,rgba(23,21,16,.12) 14px,transparent 15px 21px);mix-blend-mode:multiply}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(229,221,201,.94);z-index:5}.card{width:min(92vw,520px);padding:32px 26px;border:4px solid #171510;background:#eee7d4;text-align:center;box-shadow:12px 12px 0 rgba(23,21,16,.2)}h1{font-size:42px;margin:0 0 8px}p{font-size:18px;line-height:1.45}.btn{margin-top:14px;padding:14px 24px;border:3px solid #171510;background:#e5ddc9;color:#171510;font:700 19px Georgia;cursor:pointer}.hidden{display:none!important}.weapon{position:fixed;left:50%;bottom:-8px;width:210px;height:150px;transform:translateX(-50%);pointer-events:none}.weapon:before{content:"";position:absolute;left:72px;bottom:8px;width:66px;height:130px;border:4px solid #171510;background:#eee7d4;transform:rotate(7deg)}.weapon:after{content:"";position:absolute;left:92px;bottom:74px;width:100px;height:28px;border:4px solid #171510;background:#e5ddc9;transform:rotate(7deg)}@media(max-width:700px){#fireLeft{display:none}.hint{display:none}}@media(min-width:800px){.stick{left:34px;bottom:34px}.hint{right:28px}.weapon{bottom:0}} 
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="panel">VIDA<div class="bar"><i id="hp"></i></div><div style="margin-top:6px">COLETE</div><div class="bar"><i id="armor"></i></div></div><div class="panel">MUNIÇÃO: <span id="ammo">12</span><br>PONTOS: <span id="score">0</span><br>ONDA: <span id="wave">1</span><br>INIMIGOS: <span id="enemiesLeft">0</span><br>ABATES: <span id="kills">0</span><br>HEADSHOTS: <span id="headshots">0</span></div></div><div id="hitNotice"></div>
<div class="center"></div>
<div id="rifleScope" class="rifle-scope" aria-hidden="true"><div class="scope-cross-h"></div><div class="scope-cross-v"></div><div class="scope-dot"></div><div class="scope-mark">· · ·</div></div>
<div class="inkTexture"></div>
<div class="weapon"></div>
<div class="controls"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><button id="fireLeft" aria-label="Atirar">●</button><button id="fire" aria-label="Atirar">●</button><button id="reload" aria-label="Recarregar">↻</button><button id="weaponSwitch">ARMA: FUZIL</button><div class="hint" style="display:none"></div></div>
<div id="start" class="screen"><div class="card"><h1>SUBMUNDO: INK OPS</h1><p>Uma operação nas profundezas do mundo gamer.<br>Sobreviva aos inimigos desenhados a tinta.</p><button id="play" class="btn">ENTRAR NO SUBMUNDO</button></div></div>
<div id="over" class="screen hidden"><div class="card"><h1>VOCÊ CAIU</h1><p id="result">Pontuação: 0</p><button id="again" class="btn">TENTAR NOVAMENTE</button></div></div>
<script src="network.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
